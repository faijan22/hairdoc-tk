name: hairdoc-tk

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hairdoctk
      POSTGRES_USER: hairdoctk
      POSTGRES_PASSWORD: hairdoctk_local
    ports:
      - "5433:5432"
    volumes:
      - hairdoctk_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hairdoctk -d hairdoctk"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - hairdoctk_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hairdoctk_postgres:
  hairdoctk_redis:

